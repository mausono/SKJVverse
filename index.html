<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My project (1)</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #05070a; color: #fff; font-family: sans-serif; }
    #viewport { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #status, #rotate { position: fixed; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; background: #05070a; z-index: 2; }
    #rotate { display: none; }
    button { padding: 16px 28px; margin: 12px; background: #286cb8; color: white; border: 0; border-radius: 8px; font: inherit; cursor: pointer; }
    #message { white-space: pre-line; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: grid; z-index: 3; } }
  </style>
</head>
<body>
  <div id="viewport"><canvas id="unity-canvas" tabindex="0" aria-label="カードゲーム"></canvas></div>
  <div id="status"><p id="message">カードゲーム</p><button id="start">タップして開始</button></div>
  <div id="rotate">端末を横向きにしてプレイする</div>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const status = document.getElementById('status');
    const message = document.getElementById('message');
    const start = document.getElementById('start');
    const fail = error => { message.textContent = '起動できなかった。ページを再読み込みして再試行する。\n' + String(error); status.style.display = 'grid'; };
    start.addEventListener('click', () => {
      start.hidden = true;
      message.textContent = '読み込み中…';
      const script = document.createElement('script');
      script.src = 'Build/Web.loader.js';
      script.onerror = () => fail('ゲームファイルの取得に失敗した。');
      script.onload = () => createUnityInstance(canvas, {
        dataUrl: 'Build/Web.data.unityweb',
        frameworkUrl: 'Build/Web.framework.js.unityweb',
        codeUrl: 'Build/Web.wasm.unityweb',
        streamingAssetsUrl: 'StreamingAssets',
        autoSyncPersistentDataPath: true,
        companyName: "DefaultCompany",
        productName: "My project (1)",
        productVersion: "1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, progress => { message.textContent = '読み込み中… ' + Math.round(progress * 100) + '%'; })
      .then(instance => {
        message.textContent = '準備完了';
        start.textContent = 'プレイ';
        start.hidden = false;
        start.onclick = () => { status.style.display = 'none'; canvas.focus(); };
      }).catch(fail);
      document.body.appendChild(script);
    }, { once: true });
    canvas.addEventListener('contextmenu', event => event.preventDefault());
  </script>
</body>
</html>
